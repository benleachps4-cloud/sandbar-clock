[platformio]
default_envs = esp32c3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

; ESP32-C3 SuperMini
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLED_PIN=4
lib_deps =
  fastled/FastLED@3.10.3

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLED_PIN=12
lib_deps =
  fastled/FastLED@3.10.3

; Temporary hardware check for the S3: pio run -e led-diag -t upload
[env:led-diag]
board = esp32-s3-devkitc-1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLED_PIN=12
build_src_filter = -<*> +<../diag/>
